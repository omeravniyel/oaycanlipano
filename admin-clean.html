<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | Kartaltepe Pano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-slate-50 min-h-screen">
    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <h2 class="text-2xl font-bold text-center mb-6">Yönetici Girişi</h2>
            <form id="admin-login-form">
                <input type="password" id="master-password"
                    class="w-full p-4 border rounded-xl mb-4 text-center text-lg tracking-widest" placeholder="••••••">
                <button type="submit" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">
                    Giriş Yap
                </button>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div id="main-content" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl">
            <div class="h-20 flex items-center px-8 border-b border-slate-800/50 text-white font-bold text-xl">
                PANEL<span class="text-blue-400">V3</span>
            </div>
            <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
                <a href="#" onclick="switchView('institutions')" id="nav-institutions"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 text-white">
                    <i class="fa-solid fa-school w-5"></i> Kurumlar
                </a>
                <div class="mt-8 mb-2 px-4 text-xs font-bold text-slate-500 uppercase">İçerik</div>
                <a href="#" onclick="openHadithModal()"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-book-quran w-5"></i> Hadis Yönetimi
                </a>
                <a href="#" onclick="openGalleryModal()"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-images w-5"></i> Merkezi Galeri
                </a>
                <a href="#" onclick="openAnnouncementsModal()"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-bullhorn w-5"></i> Merkezi Duyuru
                </a>
                <div class="mt-8 mb-2 px-4 text-xs font-bold text-slate-500 uppercase">Sistem</div>
                <a href="#" onclick="openLandingModal()"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-desktop w-5"></i> Site CMS
                </a>
                <a href="#" onclick="openEmergencyModal()"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg text-red-400 hover:bg-red-900/20">
                    <i class="fa-solid fa-triangle-exclamation w-5"></i> Acil Durum
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    <i class="fa-solid fa-sign-out"></i> Çıkış
                </button>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            <!-- Header -->
            <header class="h-20 bg-white border-b flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <input type="text" id="search-input" oninput="filterInstitutions()"
                        class="bg-slate-100 rounded-xl px-4 py-2 w-64" placeholder="Kurum Ara...">
                </div>
                <button onclick="openInstitutionModal()"
                    class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-blue-700">
                    + Yeni Kurum
                </button>
            </header>

            <!-- Content -->
            <div class="flex-1 p-8 overflow-y-auto">
                <div id="institution-list" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- Institution Edit Modal -->
    <div id="edit-modal"
        class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">Kurum Düzenle</h3>
                <button onclick="closeInstitutionModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <form id="institution-form" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Slug (URL)</label>
                        <input id="form-slug" class="w-full border p-3 rounded-lg" placeholder="ornek-kurum" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Kurum Adı</label>
                        <input id="form-name" class="w-full border p-3 rounded-lg" placeholder="Örnek Kurum" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Şifre</label>
                        <input id="form-password" class="w-full border p-3 rounded-lg" placeholder="****" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Kurum Tipi</label>
                        <select id="form-type" class="w-full border p-3 rounded-lg">
                            <option>Ortaokul</option>
                            <option>Lise</option>
                            <option>Üniversite Hazırlık</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">İl</label>
                        <input id="form-city" class="w-full border p-3 rounded-lg" placeholder="İstanbul">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">İlçe</label>
                        <input id="form-district" class="w-full border p-3 rounded-lg" placeholder="Kadıköy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Mıntıka (Bölge)</label>
                        <input id="form-region" class="w-full border p-3 rounded-lg" placeholder="Merkez">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">İletişim Bilgileri</label>
                    <div class="grid grid-cols-3 gap-2">
                        <input id="form-contact-name" placeholder="Ad Soyad" class="border p-3 rounded-lg">
                        <input id="form-contact-phone" placeholder="Telefon" class="border p-3 rounded-lg">
                        <input id="form-contact-email" placeholder="E-posta" class="border p-3 rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Logo</label>
                    <div class="flex gap-2">
                        <input id="form-logo" class="flex-1 border p-3 rounded-lg" placeholder="Logo URL">
                        <input type="file" id="upload-logo-input" class="hidden" accept="image/*">
                        <button type="button" onclick="document.getElementById('upload-logo-input').click()"
                            class="bg-slate-100 px-4 rounded-lg hover:bg-slate-200">
                            Yükle
                        </button>
                    </div>
                </div>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="form-dorm-active" checked>
                        <span>Yurt Modülü</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="form-logo-locked">
                        <span>Logo Kilitle</span>
                    </label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">
                    Kaydet
                </button>
            </form>
        </div>
    </div>

    <script>
        let institutions = [];
        let MASTER_PASSWORD = localStorage.getItem('super_admin_pass') || '283353.';

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            const loginForm = document.getElementById('admin-login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    attemptLogin();
                });
            }

            // Institution form submit handler
            const institutionForm = document.getElementById('institution-form');
            if (institutionForm) {
                institutionForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await saveInstitution();
                });
            }

            // Logo upload handler
            const logoInput = document.getElementById('upload-logo-input');
            if (logoInput) {
                logoInput.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        try {
                            const res = await fetch('/api/upload', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    filename: 'logo-' + Date.now() + '.png',
                                    fileBase64: ev.target.result.split(',')[1],
                                    contentType: file.type
                                })
                            });
                            const data = await res.json();
                            document.getElementById('form-logo').value = data.url;
                            Swal.fire({
                                icon: 'success',
                                title: 'Logo yüklendi',
                                timer: 1500,
                                showConfirmButton: false
                            });
                        } catch (err) {
                            Swal.fire('Hata', 'Logo yüklenemedi', 'error');
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }

            if (localStorage.getItem('super_admin_pass')) {
                const success = await fetchInstitutions();
                if (success) {
                    showMainContent();
                } else {
                    showLoginModal();
                }
            } else {
                showLoginModal();
            }
        });

        // --- LOGIN ---
        async function attemptLogin() {
            const val = document.getElementById('master-password').value.trim();
            if (!val) {
                Swal.fire('Uyarı', 'Lütfen şifre giriniz.', 'warning');
                return;
            }

            MASTER_PASSWORD = val;
            localStorage.setItem('super_admin_pass', val);

            const success = await fetchInstitutions(true);

            if (success) {
                showMainContent();
                Swal.fire({
                    icon: 'success',
                    title: 'Giriş Başarılı',
                    timer: 1000,
                    showConfirmButton: false
                });
            } else {
                localStorage.removeItem('super_admin_pass');
            }
        }

        // --- FETCH INSTITUTIONS ---
        async function fetchInstitutions(showError = false) {
            try {
                const res = await fetch('/api/manage-institutions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'list',
                        master_password: MASTER_PASSWORD
                    })
                });

                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('API yanıt vermedi');
                }

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Sunucu hatası');
                }

                institutions = data.institutions || [];
                renderList(institutions);
                return true;

            } catch (e) {
                console.warn('Fetch Error:', e);

                const masterKeys = ['283353.', '283353', 'admin123'];
                const isMaster = masterKeys.includes(MASTER_PASSWORD);

                if (isMaster) {
                    if (showError) {
                        Swal.fire({
                            icon: 'info',
                            title: 'Offline Mode',
                            text: 'API bulunamadı, demo modunda çalışıyor.',
                            timer: 2000,
                            showConfirmButton: false
                        });
                    }

                    institutions = [
                        {
                            name: 'Demo Kurum',
                            slug: 'demo',
                            password: '123',
                            config: { city: 'İstanbul', district: 'Merkez' }
                        }
                    ];
                    renderList(institutions);
                    return true;
                }

                if (showError) {
                    Swal.fire('Giriş Başarısız', e.message || 'Bağlantı kurulamadı', 'error');
                }
                return false;
            }
        }

        // --- RENDER LIST ---
        function renderList(list) {
            const container = document.getElementById('institution-list');
            container.innerHTML = '';

            const filteredList = list.filter(inst => !inst.slug.startsWith('system-'));

            filteredList.forEach(inst => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">${inst.name}</h3>
                            <div class="flex gap-1">
                                <button onclick='openInstitutionModal(${JSON.stringify(inst).replace(/'/g, "&apos;")})' 
                                    class="w-8 h-8 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors"
                                    title="Düzenle">
                                    <i class="fa-solid fa-pen text-sm"></i>
                                </button>
                                <button onclick='deleteInstitution(${JSON.stringify(inst).replace(/'/g, "&apos;")})'
                                    class="w-8 h-8 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors"
                                    title="Sil">
                                    <i class="fa-solid fa-trash text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-sm text-slate-500 mb-3">
                            <i class="fa-solid fa-location-dot text-xs"></i>
                            ${inst.config?.city || '-'} / ${inst.config?.district || '-'}
                        </p>
                        <div class="flex items-center justify-between">
                            <div class="text-xs text-slate-400">
                                Şifre: <span class="font-mono font-bold text-slate-700">${inst.password}</span>
                            </div>
                            <a href="/${inst.slug}/admin" target="_blank" 
                               class="px-3 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">
                                <i class="fa-solid fa-external-link"></i> Aç
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- SEARCH/FILTER ---
        function filterInstitutions() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = institutions.filter(inst =>
                inst.name.toLowerCase().includes(searchTerm) ||
                inst.slug.toLowerCase().includes(searchTerm) ||
                (inst.config?.city || '').toLowerCase().includes(searchTerm) ||
                (inst.config?.district || '').toLowerCase().includes(searchTerm)
            );
            renderList(filtered);
        }

        // --- NAVIGATION ---
        function switchView(view) {
            // Currently only 'institutions' view exists
            if (view === 'institutions') {
                renderList(institutions);
            }
        }

        // --- INSTITUTION CRUD ---
        let currentEditingInstitution = null;

        function openInstitutionModal(institution = null) {
            currentEditingInstitution = institution;
            const modal = document.getElementById('edit-modal');
            const form = document.getElementById('institution-form');

            if (institution) {
                // Edit mode
                document.querySelector('#edit-modal h3').textContent = 'Kurum Düzenle';
                document.getElementById('form-slug').value = institution.slug || '';
                document.getElementById('form-name').value = institution.name || '';
                document.getElementById('form-password').value = institution.password || '';
                document.getElementById('form-type').value = institution.config?.institution_type || 'Ortaokul';
                document.getElementById('form-city').value = institution.config?.city || '';
                document.getElementById('form-district').value = institution.config?.district || '';
                document.getElementById('form-region').value = institution.config?.region || '';
                document.getElementById('form-logo').value = institution.config?.institution_logo || '';
                document.getElementById('form-contact-name').value = institution.config?.admin_contact?.name || '';
                document.getElementById('form-contact-phone').value = institution.config?.admin_contact?.phone || '';
                document.getElementById('form-contact-email').value = institution.config?.admin_contact?.email || '';
                document.getElementById('form-dorm-active').checked = institution.config?.module_dorm_active !== false;
                document.getElementById('form-logo-locked').checked = institution.config?.logo_locked || false;
            } else {
                // Create mode
                document.querySelector('#edit-modal h3').textContent = 'Yeni Kurum';
                form.reset();
                document.getElementById('form-dorm-active').checked = true;
            }

            modal.classList.remove('hidden');
        }

        function closeInstitutionModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditingInstitution = null;
        }

        async function saveInstitution() {
            try {
                const payload = {
                    slug: document.getElementById('form-slug').value.trim(),
                    name: document.getElementById('form-name').value,
                    password: document.getElementById('form-password').value.trim(),
                    type: document.getElementById('form-type').value,
                    institution_logo: document.getElementById('form-logo').value,
                    city: document.getElementById('form-city').value,
                    district: document.getElementById('form-district').value,
                    region: document.getElementById('form-region').value,
                    module_dorm_active: document.getElementById('form-dorm-active').checked,
                    logo_locked: document.getElementById('form-logo-locked').checked,
                    admin_contact: {
                        name: document.getElementById('form-contact-name').value,
                        phone: document.getElementById('form-contact-phone').value,
                        email: document.getElementById('form-contact-email').value
                    }
                };

                const res = await fetch('/api/manage-institutions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'upsert',
                        master_password: MASTER_PASSWORD,
                        payload: payload
                    })
                });

                if (!res.ok) {
                    throw new Error('Kaydetme başarısız');
                }

                closeInstitutionModal();
                await fetchInstitutions();
                Swal.fire({
                    icon: 'success',
                    title: 'Kaydedildi',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (err) {
                console.error('Save error:', err);
                Swal.fire('Hata', err.message || 'Kaydetme başarısız', 'error');
            }
        }

        async function deleteInstitution(institution) {
            const result = await Swal.fire({
                title: 'Emin misiniz?',
                text: `${institution.name} silinecek!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonText: 'İptal',
                confirmButtonText: 'Evet, Sil'
            });

            if (!result.isConfirmed) return;

            try {
                const res = await fetch('/api/manage-institutions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete',
                        master_password: MASTER_PASSWORD,
                        payload: { slug: institution.slug }
                    })
                });

                if (!res.ok) {
                    throw new Error('Silme başarısız');
                }

                await fetchInstitutions();
                Swal.fire({
                    icon: 'success',
                    title: 'Silindi',
                    timer: 1500,
                    showConfirmButton: false
                });
            } catch (err) {
                console.error('Delete error:', err);
                Swal.fire('Hata', err.message || 'Silme başarısız', 'error');
            }
        }

        // --- MODAL STUBS (to be implemented) ---
        function openHadithModal() {
            Swal.fire('Yakında', 'Hadis yönetimi eklenecek.', 'info');
        }

        function openGalleryModal() {
            Swal.fire('Yakında', 'Galeri yönetimi eklenecek.', 'info');
        }

        function openAnnouncementsModal() {
            Swal.fire('Yakında', 'Duyuru yönetimi eklenecek.', 'info');
        }

        function openLandingModal() {
            Swal.fire('Yakında', 'CMS modülü eklenecek.', 'info');
        }

        function openEmergencyModal() {
            Swal.fire('Yakında', 'Acil durum modu eklenecek.', 'info');
        }

        // --- UI HELPERS ---
        function showLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        function showMainContent() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('super_admin_pass');
            showLoginModal();
        }
    </script>
</body>

</html>
