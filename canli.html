<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartaltepe Pano - Canlı Yayın</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            DEFAULT: '#0f172a',
                            surface: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-black text-white h-screen overflow-hidden flex flex-col justify-center items-center">

    <!-- Video Container -->
    <div class="relative w-full h-full flex items-center justify-center">

        <!-- Video Element -->
        <video id="remote-video" class="w-full h-full object-contain" autoplay playsinline controls></video>

        <!-- Loading / Status Overlay -->
        <div id="status-overlay"
            class="absolute inset-0 z-20 bg-slate-900 flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="loader mb-6"></div>
            <h2 class="text-2xl font-bold mb-2 animate-pulse" id="status-title">Canlı Yayın Aranıyor...</h2>
            <p class="text-slate-400" id="status-desc">Lütfen bekleyin, yayına bağlanılıyor.</p>
            <button onclick="location.reload()"
                class="mt-8 px-6 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm border border-slate-700 transition hidden"
                id="reload-btn">
                Yeniden Dene
            </button>
        </div>

        <!-- Live Badge (Top Left) -->
        <div id="live-badge" class="absolute top-6 left-6 z-10 hidden">
            <div
                class="bg-red-600 text-white text-sm font-bold px-4 py-1.5 rounded-full flex items-center gap-2 shadow-lg animate-pulse">
                <span class="w-2.5 h-2.5 bg-white rounded-full"></span> CANLI
            </div>
        </div>

    </div>

    <!-- CONNECTION LOGIC -->
    <script>
        // CONFIG
        const urlParams = new URLSearchParams(window.location.search);
        // Fallback Slug logic
        const DEFAULT_SLUG = 'omeravniyel';
        const SLUG = urlParams.get('slug') || DEFAULT_SLUG;

        let peer;
        let targetPeerId = null;

        const videoEl = document.getElementById('remote-video');
        const overlay = document.getElementById('status-overlay');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const liveBadge = document.getElementById('live-badge');
        const reloadBtn = document.getElementById('reload-btn');

        async function initViewer() {
            // 1. Fetch Active Broadcast ID from Backend
            try {
                statusDesc.innerText = "Yayın bilgisi alınıyor... (" + SLUG + ")";
                const res = await fetch(`/api/get-config?slug=${SLUG}`);

                if (!res.ok) {
                    console.error("Config failed", res.status);
                    // maybe try hardcoded fallback ID as a last resort? 
                    // No, that causes collision.
                    throw new Error("Kurum verisi alınamadı");
                }

                const config = await res.json();
                console.log("Config loaded:", config);

                if (config && config.activeBroadcastId) {
                    targetPeerId = config.activeBroadcastId;
                    console.log("Found Active Broadcast ID:", targetPeerId);
                    startPeer();
                } else {
                    console.warn("No active broadcast ID found in config.");
                    // Retry loop
                    setTimeout(initViewer, 5000);
                }
            } catch (e) {
                console.error("Config fetch error:", e);
                statusTitle.innerText = "Bağlantı Hatası";
                statusDesc.innerText = "Sunucuya erişilemedi.";
                setTimeout(initViewer, 5000); // Keep retrying
            }
        }

        function startPeer() {
            if (peer) {
                // If peer exists, just connect
                connectToBroadcast();
                return;
            }

            peer = new Peer(null, { debug: 1 });

            peer.on('open', (id) => {
                console.log('Viewer Me ID:', id);
                connectToBroadcast();
            });

            peer.on('error', (err) => {
                console.error("Peer Error:", err);
                // If ID invalid, maybe re-fetch config?
                setTimeout(initViewer, 3000);
            });
        }

        function connectToBroadcast() {
            if (!targetPeerId) return;

            statusDesc.innerText = "Yayına bağlanılıyor...";
            console.log("Calling broadcaster:", targetPeerId);

            const call = peer.call(targetPeerId, null);

            if (!call) {
                console.warn("Call failed immediately");
                setTimeout(initViewer, 3000); // Re-init might fetch new ID
                return;
            }

            call.on('stream', (remoteStream) => {
                console.log("Stream received!");
                videoEl.srcObject = remoteStream;
                videoEl.play().catch(e => console.log("Autoplay blocked:", e));

                overlay.classList.add('opacity-0', 'pointer-events-none');
                liveBadge.classList.remove('hidden');
            });

            call.on('close', () => {
                console.log("Stream closed");
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                liveBadge.classList.add('hidden');
                statusTitle.innerText = "Yayın Sona Erdi";
                statusDesc.innerText = "Yeni yayın bekleniyor...";

                // Poll for new stream
                setTimeout(initViewer, 5000);
            });

            call.on('error', (err) => {
                console.error("Call Error:", err);
                setTimeout(initViewer, 3000);
            });
        }

        window.addEventListener('load', initViewer);

    </script>
</body>

</html>
